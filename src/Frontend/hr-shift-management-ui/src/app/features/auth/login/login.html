<div class="login-page">
    <div class="login-card">
        <div class="brand">
            <div class="brand-icon">HR</div>
            <div>
                <h1>HRShiftManagement</h1>
                <p>Hệ thống quản lý nhân sự và ca làm</p>
            </div>
        </div>

        <div class="welcome">
            <h2>Chào mừng trở lại!!!</h2>
            <p>Đăng nhập để tiếp tục vào hệ thống.</p>
        </div>

        <form (ngSubmit)="onLogin()" #loginForm="ngForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input id="email" type="email" name="email" [(ngModel)]="email" placeholder="Nhập email của bạn"
                    autocomplete="username" required email />
            </div>

            <div class="form-group">
                <label for="password">Mật khẩu</label>

                <div class="password-wrapper">
                    <input id="password" [type]="showPassword ? 'text' : 'password'" name="password"
                        [(ngModel)]="password" placeholder="Nhập mật khẩu" autocomplete="current-password" required />

                    <button type="button" class="toggle-password" (click)="showPassword = !showPassword"
                        [attr.aria-label]="showPassword ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'">
                        {{ showPassword ? 'Ẩn' : 'Hiện' }}
                    </button>
                </div>
            </div>

            <div class="error-message" *ngIf="errorMessage" role="alert">
                {{ errorMessage }}
            </div>

            <button class="login-button" type="submit" [disabled]="isLoading || loginForm.invalid">
                {{ isLoading ? 'Đang đăng nhập...' : 'Đăng nhập' }}
            </button>
        </form>

        <p class="register-link">
      Chưa có tài khoản?
      <a routerLink="/register">Đăng ký ngay</a>
    </p>

    <div class="login-footer">
            <p>HRShiftManagement · Quản lý nhân sự hiệu quả</p>
        </div>
    </div>
</div>
