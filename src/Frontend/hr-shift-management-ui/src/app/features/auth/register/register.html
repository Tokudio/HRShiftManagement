<div class="register-page">
  <div class="register-card">
    <div class="brand">
      <div class="brand-icon">HR</div>
      <div>
        <h1>HRShiftManagement</h1>
        <p>Hệ thống quản lý nhân sự và ca làm</p>
      </div>
    </div>

    <div class="welcome">
      <h2>Tạo tài khoản mới</h2>
      <p>Điền thông tin để đăng ký tài khoản nhân viên.</p>
    </div>

    <form (ngSubmit)="onRegister()" #registerForm="ngForm">
      <div class="form-group">
        <label for="fullName">Họ và tên *</label>
        <input
          id="fullName"
          type="text"
          name="fullName"
          [(ngModel)]="fullName"
          placeholder="Nhập họ và tên"
          maxlength="200"
          required
        />
      </div>

      <div class="form-group">
        <label for="email">Email *</label>
        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="example@email.com"
          autocomplete="email"
          required
          email
        />
      </div>

      
   <div class="form-group">
  <label for="phoneNumber">Số điện thoại</label>
  <input
    id="phoneNumber"
    type="tel"
    name="phoneNumber"
    [value]="phoneNumber"
    (input)="onPhoneNumberInput($event)"
    placeholder="Nhập số điện thoại (không bắt buộc)"
    autocomplete="tel"
    inputmode="numeric"
  />
</div>

      <div class="form-group">
        <label for="password">Mật khẩu *</label>
        <input
          id="password"
          [type]="showPassword ? 'text' : 'password'"
          name="password"
          [(ngModel)]="password"
          placeholder="Ít nhất 8 ký tự"
          autocomplete="new-password"
          required
        />
      </div>

      <div class="form-group">
        <label for="confirmPassword">Xác nhận mật khẩu *</label>
        <input
          id="confirmPassword"
          [type]="showPassword ? 'text' : 'password'"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          placeholder="Nhập lại mật khẩu"
          autocomplete="new-password"
          required
        />
      </div>

      <label class="show-password">
        <input
          type="checkbox"
          [checked]="showPassword"
          (change)="showPassword = !showPassword"
        />
        Hiển thị mật khẩu
      </label>

      <div class="error-message" *ngIf="errorMessage" role="alert">
        {{ errorMessage }}
      </div>

      <div class="success-message" *ngIf="successMessage" role="status">
        {{ successMessage }}
      </div>

      <button
        class="register-button"
        type="submit"
        [disabled]="isLoading || registerForm.invalid"
      >
        {{ isLoading ? 'Đang đăng ký...' : 'Đăng ký' }}
      </button>
    </form>

    <p class="login-link">
      Đã có tài khoản?
      <a routerLink="/login">Đăng nhập</a>
    </p>
  </div>
</div>
